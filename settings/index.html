<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Flow State</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #eef8f6;
      --panel: #ffffff;
      --panel-soft: #f7fbfa;
      --text: #123f3b;
      --muted: #5f7773;
      --border: #d7e8e5;
      --primary: #0d9488;
      --primary-strong: #0f766e;
      --accent: #f97316;
      --danger: #d97706;
      --shadow: 0 18px 48px rgba(19, 78, 74, 0.14);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      line-height: 1.4;
      background:
        linear-gradient(135deg, rgba(13, 148, 136, 0.12), rgba(249, 115, 22, 0.08)),
        var(--bg);
      color: var(--text);
      padding: 16px;
    }

    .shell {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 440px;
      margin: 0 auto;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 18px 18px 14px;
      background: rgba(255, 255, 255, 0.84);
      border: 1px solid rgba(255, 255, 255, 0.86);
      border-radius: 8px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    h1 {
      font-size: 22px;
      font-weight: 750;
      letter-spacing: 0;
    }

    .eyebrow {
      margin-bottom: 2px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .status-pill {
      flex: 0 0 auto;
      min-width: 82px;
      padding: 7px 10px;
      border-radius: 999px;
      border: 1px solid rgba(13, 148, 136, 0.2);
      background: #dff7f3;
      color: var(--primary-strong);
      text-align: center;
      font-size: 12px;
      font-weight: 750;
    }

    .status-pill.paused {
      border-color: rgba(217, 119, 6, 0.25);
      background: #fff4df;
      color: var(--danger);
    }

    .status-pill.idle {
      border-color: var(--border);
      background: #f6fbfa;
      color: var(--muted);
    }

    section {
      padding: 16px;
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(215, 232, 229, 0.92);
      border-radius: 8px;
      box-shadow: 0 12px 34px rgba(19, 78, 74, 0.08);
    }

    h2 {
      margin-bottom: 12px;
      font-size: 12px;
      font-weight: 800;
      color: var(--primary-strong);
      text-transform: uppercase;
    }

    label {
      display: block;
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    input,
    select {
      width: 100%;
      min-height: 40px;
      padding: 9px 11px;
      background: var(--panel-soft);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font: inherit;
      outline: none;
      transition: border-color 150ms ease, box-shadow 150ms ease, background 150ms ease;
    }

    input:focus-visible,
    select:focus-visible,
    button:focus-visible {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(20, 184, 166, 0.2);
    }

    input:hover,
    select:hover {
      background: #fff;
      border-color: #b9d8d3;
    }

    .field {
      margin-bottom: 12px;
    }

    .field:last-child {
      margin-bottom: 0;
    }

    .btn-row {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-top: 10px;
    }

    button {
      min-height: 38px;
      padding: 8px 12px;
      border: 1px solid transparent;
      border-radius: 8px;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      transition: transform 120ms ease, background 150ms ease, border-color 150ms ease;
    }

    button:hover {
      transform: translateY(-1px);
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--primary-strong);
    }

    .btn-accent {
      background: var(--accent);
      color: #fff;
    }

    .btn-accent:hover {
      background: #ea580c;
    }

    .btn-secondary {
      background: #effaf8;
      border-color: var(--border);
      color: var(--primary-strong);
    }

    .btn-secondary:hover {
      background: #dff7f3;
    }

    .btn-wide {
      grid-column: 1 / -1;
    }

    .pomodoro-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .hint {
      margin-top: 10px;
      color: var(--muted);
      font-size: 12px;
    }

    #status {
      min-height: 18px;
      margin-top: 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
    }

    #btn-update,
    #btn-pause,
    #btn-resume {
      display: none;
    }

    @media (prefers-reduced-motion: reduce) {
      input,
      select,
      button {
        transition: none;
      }

      button:hover {
        transform: none;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <div class="eyebrow">Focus control</div>
        <h1>Flow State</h1>
      </div>
      <div id="session-state" class="status-pill idle">Idle</div>
    </header>

    <section>
      <h2>Session</h2>
      <div class="field">
        <label for="task">Current task</label>
        <input type="text" id="task" placeholder="What are you working on?" />
      </div>
      <div class="btn-row">
        <button id="btn-start" class="btn-primary">Start</button>
        <button id="btn-update" class="btn-primary">Update</button>
        <button id="btn-pause" class="btn-secondary">Pause</button>
        <button id="btn-resume" class="btn-accent">Resume</button>
      </div>
      <div id="status"></div>
    </section>

    <section>
      <h2>Pomodoro Timer</h2>
      <div class="pomodoro-grid">
        <div class="field">
          <label for="pomodoro-work">Work minutes</label>
          <input type="number" id="pomodoro-work" min="1" max="90" step="1" value="25" />
        </div>
        <div class="field">
          <label for="pomodoro-short-break">Break minutes</label>
          <input type="number" id="pomodoro-short-break" min="1" max="45" step="1" value="5" />
        </div>
        <div class="field">
          <label for="pomodoro-long-break">Long break</label>
          <input type="number" id="pomodoro-long-break" min="1" max="90" step="1" value="15" />
        </div>
        <div class="field">
          <label for="pomodoro-rounds">Rounds</label>
          <input type="number" id="pomodoro-rounds" min="1" max="12" step="1" value="4" />
        </div>
      </div>
      <div class="btn-row">
        <button id="btn-save-pomodoro" class="btn-primary">Apply Timer</button>
        <button id="btn-reset-pomodoro" class="btn-secondary">Classic 25/5</button>
        <button id="btn-reset-timer" class="btn-secondary btn-wide">Reset Timer</button>
      </div>
      <p class="hint">Timer changes apply to the floating control immediately.</p>
    </section>

    <section>
      <h2>Coach</h2>
      <div class="field">
        <label for="character">Character</label>
        <select id="character"></select>
      </div>
    </section>

    <section>
      <h2>API Keys</h2>
      <div class="field">
        <label for="anthropic-key">Anthropic</label>
        <input type="password" id="anthropic-key" placeholder="Anthropic API key" />
      </div>
      <div class="field">
        <label for="elevenlabs-key">ElevenLabs</label>
        <input type="password" id="elevenlabs-key" placeholder="ElevenLabs API key" />
      </div>
    </section>
  </main>

  <script src="settings.js"></script>
</body>
</html>
