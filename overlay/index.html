<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: transparent;
      overflow: hidden;
      user-select: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 8px 10px 8px;
      gap: 6px;
    }

    #character {
      width: 92px;
      height: 92px;
      border-radius: 50%;
      overflow: hidden;
      background-color: #fff;
      background-image: url("../assets/character.png");
      background-position: center;
      background-repeat: no-repeat;
      background-size: contain;
      border: 1px solid rgba(36,49,47,0.72);
      box-shadow: none;
      -webkit-app-region: no-drag;
      display: block;
      cursor: default;
      flex-shrink: 0;
    }

    #character.sprite-avatar {
      border-radius: 50%;
      background-size: auto;
      background-position: 0 center;
      image-rendering: auto;
    }

    #character.bouncing {
      animation: bounce 0.5s ease;
    }

    @keyframes bounce {
      0%   { transform: scale(1); }
      25%  { transform: scale(1.3) rotate(-5deg); }
      50%  { transform: scale(0.9) rotate(5deg); }
      75%  { transform: scale(1.1); }
      100% { transform: scale(1); }
    }

    #timer-bar {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      -webkit-app-region: no-drag;
      width: 160px;
    }

    #timer-label {
      font-family: monospace;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #17201f;
      text-shadow: 0 1px 0 rgba(255,255,255,0.9);
    }

    #timer-track {
      width: 160px;
      height: 9px;
      background: rgba(255,255,255,0.9);
      border: 2px solid rgba(36,49,47,0.82);
      border-radius: 99px;
      overflow: hidden;
    }

    #timer-fill {
      height: 100%;
      width: 0%;
      border-radius: 99px;
      transition: width 0.9s linear;
    }

    #timer-dots {
      display: flex;
      gap: 5px;
      justify-content: center;
    }

    .timer-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ff7a5c;
      opacity: 0.2;
      transition: opacity 0.3s, box-shadow 0.3s;
    }

    #timer-controls {
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: center;
      -webkit-app-region: no-drag;
    }

    #timer-controls button {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #fff;
      border: 2px solid rgba(36,49,47,0.78);
      color: #24312f;
      font-size: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: none;
      transition: background 0.15s, transform 0.15s, border-color 0.15s;
      -webkit-app-region: no-drag;
    }

    #timer-controls button:hover {
      background: #fff;
      border-color: rgba(13,148,136,0.95);
      transform: translateY(-1px);
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.7; }
    }

    #timer-bar.paused #timer-fill {
      animation: pulse 1.5s ease-in-out infinite;
      transition: none;
    }
  </style>
</head>
<body>
  <div id="character" draggable="false"></div>

  <div id="timer-bar">
    <div id="timer-label">WORK &middot; 25:00</div>
    <div id="timer-track">
      <div id="timer-fill"></div>
    </div>
    <div id="timer-dots">
      <div class="timer-dot"></div>
      <div class="timer-dot"></div>
      <div class="timer-dot"></div>
      <div class="timer-dot"></div>
    </div>
  </div>

  <div id="timer-controls">
    <button id="timer-play">&#9654;</button>
    <button id="timer-settings">&#9881;</button>
  </div>

  <script src="overlay.js"></script>
</body>
</html>
