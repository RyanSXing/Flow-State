<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: transparent;
      overflow: hidden;
      user-select: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 10px 10px;
      gap: 8px;
    }

    #character {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
      -webkit-app-region: no-drag;
      display: block;
      cursor: default;
      flex-shrink: 0;
    }

    #character.bouncing {
      animation: bounce 0.5s ease;
    }

    @keyframes bounce {
      0%   { transform: scale(1); }
      25%  { transform: scale(1.3) rotate(-5deg); }
      50%  { transform: scale(0.9) rotate(5deg); }
      75%  { transform: scale(1.1); }
      100% { transform: scale(1); }
    }

    #timer-bar {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      -webkit-app-region: no-drag;
      width: 160px;
    }

    #timer-label {
      font-family: monospace;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #ff7a5c;
    }

    #timer-track {
      width: 160px;
      height: 8px;
      background: rgba(255,255,255,0.08);
      border-radius: 99px;
      overflow: hidden;
    }

    #timer-fill {
      height: 100%;
      width: 0%;
      border-radius: 99px;
      transition: width 0.9s linear;
    }

    #timer-dots {
      display: flex;
      gap: 5px;
      justify-content: center;
    }

    .timer-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ff7a5c;
      opacity: 0.2;
      transition: opacity 0.3s, box-shadow 0.3s;
    }

    #timer-controls {
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: center;
      -webkit-app-region: no-drag;
    }

    #timer-controls button {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      color: rgba(255,255,255,0.75);
      font-size: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
      -webkit-app-region: no-drag;
    }

    #timer-controls button:hover {
      background: rgba(255,255,255,0.18);
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.7; }
    }

    #timer-bar.paused #timer-fill {
      animation: pulse 1.5s ease-in-out infinite;
      transition: none;
    }
  </style>
</head>
<body>
  <img id="character" src="../assets/character.png" width="80" height="80" draggable="false" />

  <div id="timer-bar">
    <div id="timer-label">WORK &middot; 25:00</div>
    <div id="timer-track">
      <div id="timer-fill"></div>
    </div>
    <div id="timer-dots">
      <div class="timer-dot"></div>
      <div class="timer-dot"></div>
      <div class="timer-dot"></div>
      <div class="timer-dot"></div>
    </div>
  </div>

  <div id="timer-controls">
    <button id="timer-play">&#9654;</button>
    <button id="timer-settings">&#9881;</button>
  </div>

  <script src="overlay.js"></script>
</body>
</html>
